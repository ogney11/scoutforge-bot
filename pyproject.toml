[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scoutforge"
version = "1.0.0"
description = "ScoutForge - Roblox game scouting intelligence bot for Discord"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ScoutForge" }]
keywords = ["roblox", "discord", "scouting", "analytics", "bot"]

dependencies = [
    "discord.py>=2.3,<3.0",
    "SQLAlchemy[asyncio]>=2.0.30,<3.0",
    "asyncmy>=0.2.9",
    "cryptography>=42.0",
    "alembic>=1.13",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "APScheduler>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
scoutforge = "scoutforge.__main__:main"

[tool.setuptools.packages.find]
include = ["scoutforge*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
exclude = [".venv", "alembic"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff specific
    "ASYNC",
    "S",   # bandit
    "DTZ", # naive datetimes
    "LOG", # logging misuse
    "PTH",
    "T20", # no print
]
ignore = [
    "E501",    # line length handled by formatter
    "B008",    # function call in default arg (fastapi-style) - not used, kept for alembic
    "S101",    # assert allowed (used in tests / internal invariants)
    "RUF001",  # ambiguous unicode in strings (emojis in embeds are intentional)
    "RUF002",
    "RUF003",
    "DTZ005",  # naive datetime allowed only where explicitly documented
]

[tool.ruff.lint.per-file-ignores]
"scoutforge/tests/*" = ["S105", "S106", "S311", "T20", "DTZ001"]
"alembic/*" = ["E402"]
"scoutforge/__main__.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["scoutforge"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["^\\.venv", "^alembic", "^scoutforge/tests"]

[[tool.mypy.overrides]]
module = ["discord.*", "apscheduler.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["scoutforge/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that touch a real database (MySQL via DATABASE_URL or sqlite fallback)",
]
filterwarnings = [
    "ignore::DeprecationWarning:discord.*",
]