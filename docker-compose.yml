# ScoutForge - local stack: MySQL + bot + worker.
#
#   cp .env.example .env   # then fill in DISCORD_TOKEN and ALERT_CHANNEL_ID
#   docker compose up -d
#
# Only one of bot/worker may own the scan schedule at a time: the bot already
# runs a scheduler, so leave WORKER_ENABLED=false there when using it.

name: scoutforge

x-app: &app
  image: scoutforge:local
  build: .
  env_file: [.env]
  environment:
    DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-scoutforge}:${MYSQL_PASSWORD:-scoutforge}@db:3306/${MYSQL_DATABASE:-scoutforge}?charset=utf8mb4
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # ScoutForge stores utf8mb4 text and indexes VARCHARs, so InnoDB's default
      # 767-byte index prefix would silently truncate long keys.
      - --innodb-default-row-format=DYNAMIC
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-scoutforge}
      MYSQL_USER: ${MYSQL_USER:-scoutforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-scoutforge}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scoutforge}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Not published: only the application containers need it.
    expose:
      - "3306"

  migrate:
    <<: *app
    restart: "no"
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy

  bot:
    <<: *app
    restart: unless-stopped
    command: ["run"]
    environment:
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-scoutforge}:${MYSQL_PASSWORD:-scoutforge}@db:3306/${MYSQL_DATABASE:-scoutforge}?charset=utf8mb4
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Headless scouting: same code path, no Discord connection. Enable this instead
  # of the bot's scheduler when you want scanning to survive Discord outages.
  worker:
    <<: *app
    restart: unless-stopped
    profiles: ["worker"]
    command: ["worker"]
    environment:
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-scoutforge}:${MYSQL_PASSWORD:-scoutforge}@db:3306/${MYSQL_DATABASE:-scoutforge}?charset=utf8mb4

volumes:
  mysqldata: